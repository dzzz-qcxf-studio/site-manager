# Include this file inside an http { ... } block only when port 80 is unused.
# It exposes no legacy web root: only /s/ is served by Site Manager.
server {
    listen 80;
    listen [::]:80;
    server_name 47.86.89.203 _;

    include /etc/nginx/snippets/site-manager-location.conf;

    location / {
        return 404;
    }
}
