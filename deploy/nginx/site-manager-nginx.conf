# A self-contained Nginx instance for hosts whose existing Nginx does not own HTTP.
# It has its own PID and only includes the Site Manager server configuration.
user sitepublisher;
worker_processes auto;
pid /run/site-manager-nginx.pid;
error_log /var/log/nginx/site-manager-error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    include /etc/nginx/site-manager-http.d/*.conf;
}
