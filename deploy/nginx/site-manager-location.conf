# Include this file inside the existing public server { ... } block.
# It intentionally owns only /s/ and does not replace the server root.
location ^~ /s/ {
    alias /srv/site-manager/live/;
    index index.html;
    autoindex off;

    include /etc/nginx/mime.types;
    types {
        model/gltf-binary glb;
        model/gltf+json gltf;
        application/wasm wasm;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Accept-Ranges bytes always;

    location ~ (^|/)\. {
        return 404;
    }

    location ~* \.(?:php|py|sh)$ {
        return 404;
    }
}
